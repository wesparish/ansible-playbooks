---
# Common Ubuntu configuration - Ubuntu 24+ only. All tasks are idempotent.

- name: Require Ubuntu 24 or newer
  ansible.builtin.assert:
    that: ansible_distribution_version is version('24.04', '>=')
    fail_msg: "This role supports Ubuntu 24.04 and newer only (found {{ ansible_distribution_version }})."
  when: not ansible_check_mode

- name: Install ca-certificates
  become: true
  ansible.builtin.apt:
    name: ca-certificates
    state: present

- name: Deploy sudoers fragment for wes
  become: true
  ansible.builtin.template:
    src: "90-wes.sudo"
    dest: "/etc/sudoers.d/90-wes"
    validate: "visudo -cf %s"

- name: Ensure wes user exists
  become: true
  ansible.builtin.user:
    name: wes
    shell: /bin/bash
    password: "{{ wes_crypted_pwd }}"
    state: present

- name: Add authorized keys from local file
  become: true
  ansible.posix.authorized_key:
    user: wes
    state: present
    key: "{{ item }}"
  loop: "{{ (lookup('file', role_path + '/public-keys/wes', errors='ignore') | trim).split('\n') | reject('equalto', '') | list }}"
  when: (lookup('file', role_path + '/public-keys/wes', errors='ignore') | trim) | length > 0

- name: Add authorized keys from GitHub
  become: true
  ansible.posix.authorized_key:
    user: wes
    state: present
    key: "{{ item }}"
  loop: "{{ (lookup('url', 'https://github.com/wesparish.keys', errors='ignore') | default('') | trim).split('\n') | reject('equalto', '') | list }}"
  when:
    - not ansible_check_mode
    - not (molecule_test | default(false))
    - (lookup('url', 'https://github.com/wesparish.keys', errors='ignore') | default('') | trim) | length > 0
  ignore_errors: true

- name: Set AddressFamily in sshd_config
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^AddressFamily '
    line: 'AddressFamily inet'
  register: sshd_changes

- name: Restart SSH service
  become: true
  ansible.builtin.service:
    name: ssh
    state: restarted
    enabled: true
  when: sshd_changes.changed

- name: Set kernel.panic in sysctl
  become: true
  ansible.posix.sysctl:
    name: kernel.panic
    value: "10"
    state: present
    reload: true

- name: Install nfs-common
  become: true
  ansible.builtin.apt:
    name: nfs-common
    state: present

- name: Install python3-routes (for ceph dashboard)
  become: true
  ansible.builtin.apt:
    name: python3-routes
    state: present

- name: Create /mnt/raid5_kdrive directory
  become: true
  ansible.builtin.file:
    path: /mnt/raid5_kdrive
    state: directory
  when:
    - location | default('') == "weshouse"

- name: Mount NFS home dir (weshouse)
  become: true
  ansible.posix.mount:
    path: /home/wes
    src: 172.16.1.17:/mnt/raid5_kdrive/home/wes
    fstype: nfs
    state: mounted
  when:
    - location | default('') == "weshouse"
    - not (molecule_test | default(false))

- name: Mount home dir (jamiehouse)
  become: true
  ansible.posix.mount:
    path: "{{ home_dir[location]['path'] }}"
    src: "{{ home_dir[location]['src'] }}"
    fstype: "{{ home_dir[location]['fstype'] }}"
    opts: "{{ home_dir[location]['opts'] }}"
    state: mounted
  when:
    - location | default('') == "jamiehouse"
    - not (molecule_test | default(false))

- name: Mount NFS raid5_kdrive (weshouse)
  become: true
  ansible.posix.mount:
    path: /mnt/raid5_kdrive
    src: 172.16.1.17:/mnt/raid5_kdrive/
    fstype: nfs
    state: mounted
  when:
    - location | default('') == "weshouse"
    - not (molecule_test | default(false))

- name: Install and enable chrony
  become: true
  ansible.builtin.apt:
    name: chrony
    state: present

- name: Enable chrony
  become: true
  ansible.builtin.systemd:
    name: chrony
    enabled: true

- name: Start chrony
  become: true
  ansible.builtin.systemd:
    name: chrony
    state: started

- name: Configure page-up history in inputrc
  become: true
  ansible.builtin.lineinfile:
    path: /etc/inputrc
    regexp: 'history-search-forward'
    line: '"\e[6~": history-search-forward'
    insertafter: EOF

- name: Configure page-down history in inputrc
  become: true
  ansible.builtin.lineinfile:
    path: /etc/inputrc
    regexp: 'history-search-backward'
    line: '"\e[5~": history-search-backward'
    insertafter: EOF

- name: Ensure rbd module is in /etc/modules
  become: true
  ansible.builtin.lineinfile:
    path: /etc/modules
    line: "rbd"
    create: true

- name: Load rbd kernel module
  become: true
  community.general.modprobe:
    name: rbd
    state: present

- name: Stop and disable systemd-resolved
  become: true
  ansible.builtin.systemd:
    name: systemd-resolved
    enabled: false
    state: stopped

- name: Deploy resolv.conf
  become: true
  ansible.builtin.template:
    src: "resolv.conf.j2"
    dest: "/etc/resolv.conf"
    owner: root
    group: root
    mode: "0644"
