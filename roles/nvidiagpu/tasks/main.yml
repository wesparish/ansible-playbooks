---
# NVIDIA GPU support - Ubuntu package manager only (no custom drivers/kernel)

- name: Ensure universe repository is enabled (for nvidia-container-toolkit)
  become: true
  ansible.builtin.apt_repository:
    repo: "deb http://archive.ubuntu.com/ubuntu {{ ansible_distribution_release }} universe"
    state: present
  when: ansible_distribution_release is defined

- name: Install NVIDIA driver (Ubuntu packages)
  become: true
  ansible.builtin.apt:
    name: "{{ nvidia_driver_package }}"
    state: present
    update_cache: true

- name: Install NVIDIA container toolkit (for Docker)
  become: true
  ansible.builtin.apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: true

- name: Add wes to video group
  become: true
  ansible.builtin.user:
    name: wes
    groups: video
    append: true
